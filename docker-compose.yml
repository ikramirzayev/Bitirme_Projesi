version: "3.8"

services:
  juice-shop:
    image: bkimminich/juice-shop
    container_name: juice-shop
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - pentest-lab

  dvwa:
    image: vulnerables/web-dvwa
    container_name: dvwa
    ports:
      - "8081:80"
    restart: unless-stopped
    networks:
      - pentest-lab

networks:
  pentest-lab:
    driver: bridge
